[package]
name = "voi-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
tokio.workspace = true
dirs = "5"
# Asking GitHub whether a newer build is out; the same client voi-soniox uses.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
voi-audio = { path = "../voi-audio" }
voi-soniox = { path = "../voi-soniox" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading",
] }
